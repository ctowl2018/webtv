pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("$rootDir/third_party/maven") }
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

include ':app'
include ':catvod'
// Python (Chaquopy) runtime module is intentionally NOT included in this build:
// the goal is a Python-free APK, and excluding the project keeps Chaquopy's
// pip / buildPython steps (which need a host Python 3.10) out of the build graph.
// include ':chaquo'
include ':quickjs'
rootProject.name = "TV"
